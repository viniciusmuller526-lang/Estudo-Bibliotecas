<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Painel de Cursos</title>
    <style>
        body {
            font-family: Arial, sans-serif;               
            background-color: #0d694e;
            margin: 40px;
        }
        h1{
            color: white;
        }
        button {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
        }
        ul {
            list-style: none;
            padding: 0;
        }
        li {
            background-color: white;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 6px;
            border-left: 5px solid #2563eb;
        }
    </style>
</head>
<body>
    <h1>Painel de Cursos</h1>
    <button onclick="carregarCursos()">Carregar Dados</button>
    
    <ul id = "lista_cursos"></ul>
    
    <script>
        function carregarCursos(){

            fetch("/cursos")
                
                .then(resposta => resposta.json())
                .then(dados => {

                    const lista = document.getElementById("lista_cursos");
                    lista.innerHTML = "";
                    
                    dados.forEach(item => {
                    
                        const li = document.createElement("li");
                        li.textContent = `${item.curso} - Alunos: ${item.alunos_ativos}`;                        
                        lista.appendChild(li);
                    
                    });
                })
        }
    </script>
</body>
</html>
